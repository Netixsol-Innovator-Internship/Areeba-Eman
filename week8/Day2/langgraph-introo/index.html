<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class=" flex flex-col">

  <!-- Header -->
  <header class="bg-white/60 absolute inset-x-0 top-0 backdrop-blur-md shadow-md py-4">
    <h1 class="text-center text-3xl font-bold text-pink-600">Areeba's Chatbot 🌼</h1>
  </header>

  <!-- Chat Area -->
  <main id="chat-area"
        class="flex-1 bg-gradient-to-br from-pink-100 to-purple-200 min-h-[600px]  max-h-[600px] overflow-y-auto px-4 py-6 space-y-4 max-w-2xl mx-auto w-full">
    <!-- Messages will appear here -->
    <!-- Example message -->
    <div class="flex justify-start">
      <div class="bg-white rounded-2xl px-4 py-2 shadow max-w-[75%]">
        <p class="text-gray-700 text-sm">Hello! I’m your friendly AI</p>
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <form id="chat-form"
        class="flex items-center gap-2 rounded-xl inset-x-0 bottom-0 p-4 bg-white/70 backdrop-blur-md shadow-inner max-w-2xl mx-auto w-full">
    <input
      id="user-input"
      type="text"
      placeholder="Type your message..."
      class="flex-1 px-4 py-2 rounded-full border border-pink-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
      required
    />
    <button
      type="submit"
      class="px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-full shadow">
      Send 
    </button>
  </form>

  <script>
    const chatArea = document.getElementById('chat-area');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');

    function appendMessage(text, from) {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex ' + (from === 'ai' ? 'justify-start' : 'justify-end');
      wrapper.innerHTML = `
        <div class="${from === 'ai'
          ? 'bg-white text-gray-700'
          : 'bg-pink-500 text-white'} rounded-2xl px-4 py-2 shadow max-w-[75%] text-sm">
          ${text}
        </div>
      `;
      chatArea.appendChild(wrapper);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  appendMessage(message, 'user');
  input.value = '';

  // Call your Node.js backend
  try {
    const res = await fetch('http://localhost:3000/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });

    const data = await res.json();
    appendMessage(data.reply, 'ai');
  } catch (err) {
    appendMessage("Error talking to AI 😢", 'ai');
    console.error(err);
  }
});

  </script>

</body>
</html>
